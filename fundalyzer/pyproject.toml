[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundalyzer"
version = "0.1.0"
description = "Fundamental analysis pipeline CLI"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.30",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
fundalyzer = "fundalyzer.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
